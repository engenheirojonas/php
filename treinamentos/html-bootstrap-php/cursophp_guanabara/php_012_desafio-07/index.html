<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 001</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
        <h1>Analisador de Número Real</h1>
    </header>
    <section>
        <form action="numero.php" method="post">
            <label for="n">Número Real:</label>

                <!--o step é para aceitar numeros reais ou com virgulas e suas casas decimais ou numeros de precisao exemplo 5,456 aqui temos 3 numeros de precisao apos a virgula-->
            <input type="Number" name="n" id="n" step="0.001">
            <input type="submit" value="Analisar" >
        </form>
    </section>
</body>
</html>
